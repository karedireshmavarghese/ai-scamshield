<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ScamShield</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --panel-alt: #1f2937;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --primary: #38bdf8;
            --primary-strong: #0ea5e9;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: rgba(148, 163, 184, 0.2);
            --shadow: rgba(15, 23, 42, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #020817 0%, var(--bg) 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .container {
            width: min(100%, 760px);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2.2rem, 5vw, 3rem);
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .card {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 20px 45px var(--shadow);
            padding: 24px;
            backdrop-filter: blur(8px);
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: var(--text);
        }

        textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.9);
            color: var(--text);
            font: inherit;
            padding: 16px;
            resize: vertical;
            min-height: 180px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
            margin-bottom: 20px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        #scanButton {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
            color: #082f49;
        }

        #clearButton {
            background: rgba(148, 163, 184, 0.12);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .result {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 14px;
            min-height: 120px;
            padding: 18px;
            color: var(--text);
        }

        .result.placeholder {
            color: var(--muted);
        }

        .result-title {
            margin: 0 0 8px;
            font-size: 1.1rem;
        }

        .result-score {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.12);
            color: var(--success);
            font-weight: 700;
        }

        .result-warning {
            background: rgba(245, 158, 11, 0.12);
            color: var(--warning);
        }

        .result-danger {
            background: rgba(239, 68, 68, 0.12);
            color: var(--danger);
        }

        @media (max-width: 520px) {
            .card {
                padding: 18px;
            }

            .actions {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>🛡️ AI ScamShield</h1>
            <p class="subtitle">Detect scams and understand why a message may be suspicious.</p>
        </header>

        <main class="card">
            <label for="message">Paste a suspicious message</label>
            <textarea
                id="message"
                placeholder="Paste a suspicious message here..."
                rows="10"
                cols="50"
                aria-label="Suspicious message input"
            ></textarea>

            <div class="actions">
                <button id="scanButton" type="button">🔍 Scan Message</button>
                <button id="clearButton" type="button">Clear</button>
            </div>

            <div id="result" class="result placeholder" aria-live="polite">
                Your scam assessment will appear here.
            </div>
        </main>
    </div>

    <script src="./app.js" defer></script>
</body>
</html>
